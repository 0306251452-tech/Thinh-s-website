<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liên hệ khách sạn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(circle at top,#1e293b,#0f172a,#020617);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

/* CONTAINER */
.contact-container{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.1);
}

/* TITLE */
.title{
    text-align:center;
    font-size:34px;
    margin:30px 0 10px;
    color:#60a5fa;
}

/* INFO */
.info{
    padding:30px 40px;
}

.info-item{
    margin-bottom:20px;
}

.info-item h3{
    font-size:12px;
    text-transform:uppercase;
    color:#94a3b8;
    margin-bottom:5px;
}

.info-item p{
    font-size:16px;
    color:#e2e8f0;
}

/* FORM */
form{
    padding:30px 40px 40px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#94a3b8;
    font-size:14px;
}

input, textarea{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.92);
    transition:0.3s;
    font-size:14px;
}

input:focus,
textarea:focus{
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(96,165,250,0.6);
}

/* BUTTON */
button{
    width:100%;
    padding:15px;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    color:white;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 25px rgba(59,130,246,0.4);
}

/* BACK */
.back{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#94a3b8;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:white;
}

/* RESPONSIVE */
@media(max-width:768px){
    body{
        align-items:flex-start;
    }
}

</style>
</head>

<body>

<div class="contact-container">

    <h2 class="title">Liên Hệ Khách Sạn</h2>

    <div class="info">
        <div class="info-item">
            <h3>Địa chỉ</h3>
            <p>123 Nguyễn Huệ, TP.HCM</p>
        </div>

        <div class="info-item">
            <h3>Điện thoại</h3>
            <p>0344344627</p>
        </div>

        <div class="info-item">
            <h3>Email</h3>
            <p>khachsantinhyeulephucthinh@gmail.com</p>
        </div>

        <div class="info-item">
            <h3>Giờ hoạt động</h3>
            <p>24/24 - Luôn phục vụ</p>
        </div>
    </div>

    <form id="contactForm">
        <label>Họ và tên</label>
        <input type="text" required>

        <label>Email</label>
        <input type="email" required>

        <label>Nội dung liên hệ</label>
        <textarea rows="4" placeholder="Nhập nội dung..."></textarea>

        <button type="submit">Gửi liên hệ</button>

        <a href="index.html" class="back">← Quay lại trang chủ</a>
    </form>

</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Gửi liên hệ thành công! Khách sạn sẽ phản hồi sớm.");
    this.reset();
});
</script>

</body>
</html>S
